services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlds423-credit-default-api:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-2}
      CREDIT_DEFAULT_CONFIG_PATH: configs/config.yaml
      CREDIT_DEFAULT_LOG_LEVEL: ${CREDIT_DEFAULT_LOG_LEVEL:-INFO}
    volumes:
      - ./configs:/app/configs:ro
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./reports:/app/reports
